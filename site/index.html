<script>// Чиста логіка планувальника. Працює і в Node (тести), і в браузері (window.Core).
(function (root) {
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const byId = (recipes, id) => recipes.find(r => r.id === id);

  function allowed(recipe, prefs) {
    if (recipe.semi && (prefs.semiMax ?? 3) === 0) return false;
    if (recipe.contains.some(d => prefs.dislikes.includes(d))) return false;
    return recipe.appliances.length === 0 || recipe.appliances.some(a => prefs.appliances.includes(a));
  }
  function needs(ids, recipes, people) {
    const g = {};
    ids.forEach(id => byId(recipes, id).ing.forEach(([p, q]) => { g[p] = (g[p] || 0) + q * people; }));
    return g;
  }
  // Позиція мережі: {p: ціна, pack: г/мл в упаковці} або {p: ціна за кг, kg: true} (ваговий товар)
  function itemOf(prices, store, pid) {
    const v = prices.stores[store] && prices.stores[store][pid];
    return v && typeof v.p === "number" && v.p > 0 && (v.kg || v.pack > 0) ? v : null;
  }
  function lineCost(it, need) {
    if (it.kg) { const g = Math.ceil(need / 50) * 50; return { qty: g, packs: null, sum: Math.round(it.p * g / 10) / 100 }; }
    const packs = Math.ceil(need / it.pack); return { qty: packs * it.pack, packs, sum: Math.round(packs * it.p * 100) / 100 };
  }
  // Змішаний кошик (store === "mix"): кожен продукт — у мережі, де він найдешевший, серед prefs.mixStores.
  // Мережа лишається в кошику, лише якщо економія в ній ≥ prefs.minSave (щоб не їхати в магазин заради дрібниці).
  const effCost = (it, need, prod) => { const lc = lineCost(it, need); return lc.sum - (prod.frozen && !it.kg && lc.qty > need ? 0.8 * lc.sum * (lc.qty - need) / lc.qty : 0); };
  function assign(g, ctx) {
    let allowed = (ctx.prefs.mixStores || ["atb", "silpo", "metro"]).filter(s => ctx.prices.stores[s]);
    const minSave = ctx.prefs.minSave ?? 50;
    for (;;) {
      const asg = {}, save = {}; allowed.forEach(s => save[s] = 0);
      for (const p in g) {
        const opts = allowed.map(s => { const it = itemOf(ctx.prices, s, p); return it ? { s, c: effCost(it, g[p], ctx.products[p]) } : null; }).filter(Boolean).sort((x, y) => x.c - y.c);
        if (!opts.length) continue;
        asg[p] = opts[0].s;
        save[opts[0].s] += opts.length > 1 ? opts[1].c - opts[0].c : 1e6;     // єдина мережа з товаром — її не прибираємо
      }
      if (allowed.length < 2) return { asg, stores: allowed };
      const used = allowed.filter(s => Object.values(asg).includes(s));
      const weak = used.filter(s => save[s] < minSave).sort((x, y) => save[x] - save[y])[0];
      if (!weak || used.length < 2) return { asg, stores: used };
      allowed = allowed.filter(s => s !== weak);
    }
  }
  function cost(ids, ctx, store) {
    const g = needs(ids, ctx.recipes, ctx.prefs.people);
    const asg = store === "mix" ? assign(g, ctx).asg : null;
    let total = 0, stock = 0; const missing = [], byStore = {};
    for (const p in g) {
      const st = asg ? asg[p] : store, it = st ? itemOf(ctx.prices, st, p) : null;
      if (!it) { missing.push(p); continue; }
      const lc = lineCost(it, g[p]); total += lc.sum; byStore[st] = (byStore[st] || 0) + lc.sum;
      if (ctx.products[p].frozen && !it.kg && lc.qty > g[p]) stock += lc.sum * (lc.qty - g[p]) / lc.qty; // залишок іде в морозилку
    }
    for (const k in byStore) byStore[k] = Math.round(byStore[k] * 100) / 100;
    return { total: Math.round(total * 100) / 100, stock: Math.round(stock * 100) / 100, missing, byStore };
  }
  const SLOTS = ["breakfast", "lunch", "dinner", "snack"];
  // План: масив днів [{breakfast: id, lunch: id, dinner: id, snack: id}] — лише обрані прийоми (prefs.slots)
  const flat = plan => plan.flatMap(d => SLOTS.filter(s => d[s] != null).map(s => d[s]));
  const slotsOf = prefs => SLOTS.filter(s => (prefs.slots || ["dinner"]).includes(s));
  function poolFor(slot, ctx) { return ctx.recipes.filter(r => (r.meals || ["dinner"]).includes(slot) && allowed(r, ctx.prefs)).map(r => r.id); }
  function moodScore(ids, recipes, moods) {
    return ids.reduce((s, id) => s + byId(recipes, id).tags.filter(t => moods.includes(t)).length, 0);
  }
  function objective(plan, ctx) {
    const ids = flat(plan), cc = cost(ids, ctx, ctx.prefs.store), c = cc.total - cc.stock * 0.8; // запас у морозилці майже не «з'їдає» бюджет
    const over = Math.max(0, c - ctx.prefs.budget);
    let pen = 0;
    plan.forEach((d, i) => {
      if (d.lunch != null && d.lunch === d.dinner) pen += 40;                      // однакове на обід і вечерю
      const p = plan[i - 1]; if (p) SLOTS.forEach(s => { if (d[s] != null && d[s] === p[s]) pen += 15; }); // те саме два дні поспіль
    });
    const repeats = ids.length - new Set(ids).size;
    const soups = ids.filter(id => byId(ctx.recipes, id).soup).length;
    pen += Math.max(0, soups - (ctx.prefs.maxSoups ?? 2)) * 60;               // не більше 2 супів на тиждень
    pen += cc.missing.length * 120;                                          // товару немає в обраній мережі
    const semi = ids.filter(id => byId(ctx.recipes, id).semi).length;
    pen += Math.max(0, semi - (ctx.prefs.semiMax ?? 3)) * 60;                 // напівфабрикати — не частіше за вибране
    return moodScore(ids, ctx.recipes, ctx.prefs.moods) * 4 - over * 2 - pen - repeats * 2 - c / 100;
  }
  function generate(ctx, rng = mulberry32(Date.now() & 0xffffffff), iterations = 500) {
    const slots = slotsOf(ctx.prefs), pools = {};
    for (const s of slots) { pools[s] = poolFor(s, ctx); if (!pools[s].length) return []; }
    let best = null, bestScore = -Infinity;
    for (let k = 0; k < iterations; k++) {
      const order = {}; slots.forEach(s => order[s] = shuffle(pools[s], rng));
      const plan = Array.from({ length: ctx.prefs.days }, (_, i) => { const d = {}; slots.forEach(s => d[s] = order[s][(i + (s === "dinner" ? Math.floor(order[s].length / 2) : 0)) % order[s].length]); return d; });
      const sc = objective(plan, ctx);
      if (sc > bestScore) { bestScore = sc; best = plan; }
    }
    return best;
  }
  function swap(plan, day, slot, ctx) {
    const pool = poolFor(slot, ctx).filter(id => id !== plan[day][slot]);
    if (!pool.length) return plan;
    const used = new Set(flat(plan)), fresh = pool.filter(id => !used.has(id)), cands = fresh.length ? fresh : pool;
    let best = plan, bestScore = -Infinity;
    cands.forEach(id => { const p = plan.map(d => ({ ...d })); p[day][slot] = id; const sc = objective(p, ctx); if (sc > bestScore) { bestScore = sc; best = p; } });
    return best;
  }
  function shoppingList(ids, ctx, store) {
    const g = needs(ids, ctx.recipes, ctx.prefs.people);
    const asg = store === "mix" ? assign(g, ctx).asg : null, order = ["atb", "silpo", "metro"];
    const groups = {};
    for (const p in g) {
      const st = asg ? asg[p] || null : store, prod = ctx.products[p], it = st ? itemOf(ctx.prices, st, p) : null, lc = it ? lineCost(it, g[p]) : null;
      const key = (asg ? (st || "zz") + "|" : "") + prod.cat;
      (groups[key] = groups[key] || { cat: prod.cat, store: asg ? st : undefined, items: [] }).items.push({ id: p, name: prod.name, title: it ? it.t : null, url: it ? it.url : null, kg: it ? !!it.kg : false,
        packs: lc ? lc.packs : null, qty: lc ? lc.qty : null, need: g[p], sum: lc ? lc.sum : null, store: st,
        left: lc && prod.frozen && !it.kg && lc.qty > g[p] ? Math.round(lc.qty - g[p]) : 0 });
    }
    const rank = x => x.store === undefined ? 0 : x.store === null ? 99 : order.indexOf(x.store);
    return Object.values(groups).sort((a, b) => rank(a) - rank(b) || a.cat.localeCompare(b.cat, "uk"))
      .map(gr => ({ ...gr, items: gr.items.sort((a, b) => a.name.localeCompare(b.name, "uk")) }));
  }
  function avgKcal(ids, recipes) {
    return ids.length ? Math.round(ids.reduce((s, id) => s + byId(recipes, id).macro[0], 0) / ids.length) : 0;
  }
  // План заготовок: 1 сесія на ≤3 дні, інакше дві (перед Пн — на Пн–Ср, у Ср ввечері — на Чт–Нд)
  function prepPlan(plan, ctx) {
    const prep = ctx.prep || {}, n = plan.length, people = ctx.prefs.people;
    const windows = n <= 3 ? [[0, n]] : [[0, 3], [3, n]];
    const names = ["Нд ввечері (на Пн–Ср)", "Ср ввечері (на Чт–Нд)"];
    return windows.map(([a, b], w) => {
      const tasks = {};
      for (let d = a; d < b; d++) SLOTS.forEach(s => {
        const id = plan[d][s]; if (id == null) return; const r = byId(ctx.recipes, id);
        (r.prep || []).forEach(k => {
          if (!prep[k]) return;
          const t = tasks[k] = tasks[k] || { key: k, text: prep[k].text, how: prep[k].how, min: prep[k].min, keeps: prep[k].keeps, dishes: [], grams: {} };
          if (!t.dishes.includes(r.name)) t.dishes.push(r.name);
          r.ing.forEach(([p, q]) => {
            if (k === "grain" && (prep.grain.grains || []).includes(p)) t.grams[p] = (t.grams[p] || 0) + q * people;
            if (k === "boil_eggs" && p === "eggs") t.grams.eggs = (t.grams.eggs || 0) + q * people;
          });
          if (d - a + 1 > prep[k].keeps) t.warn = `зберігається ${prep[k].keeps} дн. — для «${r.name}» (${["Пн","Вт","Ср","Чт","Пт","Сб","Нд"][d]}) частину заморозьте або приготуйте в день подачі`;
        });
      });
      const list = Object.values(tasks).map(t => {
        let qty = "";
        if (t.key === "grain") qty = Object.entries(t.grams).map(([p, g]) => `${ctx.products[p].name.toLowerCase()} — ${Math.round(g)} г сухої`).join(", ");
        if (t.key === "boil_eggs") qty = `${Math.ceil(t.grams.eggs / 60)} шт`;
        return { key: t.key, text: t.text, how: t.how, min: t.min, qty, dishes: t.dishes, warn: t.warn || null };
      });
      return { title: n <= 3 ? "Перед початком" : names[w], from: a, to: b - 1, tasks: list, minutes: list.reduce((m, t) => m + t.min, 0) };
    }).filter(x => x.tasks.length);
  }
  function dayMacro(day, recipes) {
    return SLOTS.filter(s => day[s] != null).reduce((m, s) => byId(recipes, day[s]).macro.map((v, i) => m[i] + v), [0, 0, 0, 0]);
  }
  const api = { prepPlan, dayMacro, SLOTS, flat, slotsOf, poolFor, mulberry32, itemOf, lineCost, allowed, needs, cost, generate, swap, shoppingList, avgKcal, objective };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Core = api;
})(typeof window !== "undefined" ? window : globalThis);

<script>// Інтерфейс. Очікує window.Core та window.DATA = {products, recipes, prices}.
const { products: PR, recipes: RC, prep: PREP } = window.DATA;
let PRICES = window.DATA.prices;
const MOODS = [["fast","⚡","Швидко"],["lowcal","🥬","Мало калорій"],["protein","💪","Багато білка"],["family","👨‍👩‍👧","Для сім'ї"],["comfort","🍲","Ситно й затишно"],["veg","🌱","Без м'яса"]];
const DIS = [["chicken","Курка"],["pork","Свинина/фарш"],["fish","Риба"],["eggs","Яйця"],["dairy","Молочне"],["mushrooms","Гриби"]];
const APP = [["stove","🔥","Плита"],["oven","♨️","Духовка"],["airfryer","🌀","Аерогриль"],["microwave","📡","Мікрохвильовка"]];
const SL = { breakfast: ["☀️","Сніданок"], lunch: ["🍲","Обід"], dinner: ["🌙","Вечеря"], snack: ["🍏","Перекус"] };
const ST = { atb: "АТБ", silpo: "Сільпо", metro: "METRO" };
const ICON = { atb: "🟥", silpo: "🟧", metro: "🟦", mix: "🧺" };
const stName = k => k === "mix" ? "усіх обраних мереж (" + S.prefs.mixStores.map(x => ST[x]).join(" + ") + ")" : ST[k];
const DS = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const DAYS = ["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота","Неділя"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let S = { step: 0, prefs: { people: 1, store: "atb", budget: 2200, days: 7, slots: ["breakfast","lunch","dinner","snack"], moods: ["fast"], semiMax: 3, mixStores: ["atb","silpo","metro"], minSave: 50, dislikes: [], appliances: ["stove","oven"] }, plan: [], done: {}, ck: {}, tab: "plan", open: null, day: 0 };
const validPlan = p => Array.isArray(p) && p.every(d => d && typeof d === "object" && Core.SLOTS.every(s => d[s] == null || RC.some(r => r.id === d[s])));
try { const x = JSON.parse(localStorage.getItem("koshyk3") || "null"); if (x && x.prefs) { const plan = validPlan(x.plan) ? x.plan : []; S = Object.assign(S, x, { plan, step: plan.length ? 9 : 0, open: null }); } } catch (e) {}
const save = () => { try { localStorage.setItem("koshyk3", JSON.stringify(S)); } catch (e) {} };
const ctx = () => ({ products: PR, recipes: RC, prices: PRICES, prep: PREP, prefs: S.prefs });
const $ = id => document.getElementById(id);
const tg = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];
const rec = id => RC.find(r => r.id === id);
function setP(k, v) { S.prefs[k] = v; render(); }
function setPeople(dx) { const n = Math.min(8, Math.max(1, S.prefs.people + dx)); S.prefs.people = n; S.prefs.budget = Math.round(2200 * (1 + (n - 1) * 0.8) / 100) * 100; render(); }
const emptySlots = () => Core.slotsOf(S.prefs).filter(s => !Core.poolFor(s, ctx()).length);
const people = n => n === 1 ? "особа" : n < 5 ? "особи" : "осіб";

const steps = [
  () => `<h1>Для скількох людей готуємо?</h1><div class="sub">Підберемо порції та кількість продуктів.</div><div class="stepper"><button aria-label="менше" onclick="setPeople(-1)">−</button><span>${S.prefs.people}</span><button aria-label="більше" onclick="setPeople(1)">+</button></div><div class="note" style="text-align:center">Стартовий бюджет: ${S.prefs.budget} ₴ на тиждень (змінюється далі)</div>`,
  () => `<h1>Де купуєте продукти?</h1><div class="sub">Меню складемо з асортименту й цін обраних мереж.</div><div class="grid">${[...Object.entries(ST), ["mix", "Разом — де дешевше"]].map(([k,v]) => `<div class="opt ${S.prefs.store===k?"on":""}" onclick="setP('store','${k}')"><b>${ICON[k]}</b>${v}</div>`).join("")}</div>
  ${S.prefs.store === "mix" ? `<h2>З яких мереж складати кошик?</h2><div class="sub" style="margin-bottom:10px">Кожен продукт візьмемо там, де він найдешевший. Оберіть щонайменше дві.</div>
  <div class="chips">${Object.entries(ST).map(([k,v]) => `<div class="chip ${S.prefs.mixStores.includes(k)?"sel":""}" onclick="setP('mixStores',tg(S.prefs.mixStores,'${k}'))">${ICON[k]} ${v}</div>`).join("")}</div>
  <h2>Іти в ще один магазин, якщо економія від</h2><div class="chips">${[0,50,100,200].map(v => `<div class="chip ${S.prefs.minSave===v?"sel":""}" onclick="setP('minSave',${v})">${v ? v + " ₴" : "будь-якої"}</div>`).join("")}</div>
  ${S.prefs.mixStores.length < 2 ? `<p class="bad">Оберіть щонайменше дві мережі.</p>` : ""}` : ""}`,
  () => `<h1>Які прийоми їжі плануємо?</h1><div class="sub">Можна обрати кілька.</div><div class="grid">${Object.entries(SL).map(([k,[e,t]]) => `<div class="opt ${S.prefs.slots.includes(k)?"on":""}" onclick="setP('slots',tg(S.prefs.slots,'${k}'))"><b>${e}</b>${t}</div>`).join("")}</div>
  <h2>На скільки днів?</h2><div class="chips">${[3,5,7].map(d => `<div class="chip ${S.prefs.days===d?"sel":""}" onclick="setP('days',${d})">${d} днів</div>`).join("")}</div>`,
  () => `<h1>Який бюджет на тиждень?</h1><div class="sub">Без солі, спецій і того, що вже є вдома. Фасовані продукти рахуються цілими упаковками.</div><div class="big">${S.prefs.budget} ₴</div><input type="range" min="300" max="8000" step="100" value="${S.prefs.budget}" oninput="S.prefs.budget=+this.value;document.querySelector('.big').textContent=this.value+' ₴'">`,
  () => `<h1>Що хочеться цього тижня?</h1><div class="sub">Можна обрати кілька.</div><div class="grid">${MOODS.map(([k,e,t]) => `<div class="opt ${S.prefs.moods.includes(k)?"on":""}" onclick="setP('moods',tg(S.prefs.moods,'${k}'))"><b>${e}</b>${t}</div>`).join("")}</div>
  <h2>Напівфабрикати з морозилки</h2><div class="sub" style="margin-bottom:10px">Вареники, пельмені, сирники, хачапурі, деруни, голубці…</div><div class="chips">${[[0,"Не беру"],[3,"Іноді (до 3 на тиждень)"],[7,"Часто (до 7)"]].map(([v,t]) => `<div class="chip ${(S.prefs.semiMax ?? 3)===v?"sel":""}" onclick="setP('semiMax',${v})">${t}</div>`).join("")}</div>`,
  () => `<h1>Чого не їсте?</h1><div class="sub">Такі страви не потраплять у меню.</div><div class="chips">${DIS.map(([k,t]) => `<div class="chip ${S.prefs.dislikes.includes(k)?"on":""}" onclick="setP('dislikes',tg(S.prefs.dislikes,'${k}'))">${t}</div>`).join("")}</div>`,
  () => { const e = emptySlots(); return `<h1>Яка техніка є на кухні?</h1><div class="sub">Рецепти підлаштуємо під неї.</div><div class="grid">${APP.map(([k,em,t]) => `<div class="opt ${S.prefs.appliances.includes(k)?"on":""}" onclick="setP('appliances',tg(S.prefs.appliances,'${k}'))"><b>${em}</b>${t}</div>`).join("")}</div>
  ${e.length ? `<p class="bad" style="margin-top:14px">Немає жодного рецепта для: ${e.map(s => SL[s][1].toLowerCase()).join(", ")}. Приберіть частину заборон або додайте техніку.</p>` : ""}`; }
];
const LAST = steps.length - 1;
function canNext() {
  if (S.step === 1 && S.prefs.store === "mix") return S.prefs.mixStores.length >= 2;
  if (S.step === 2) return S.prefs.slots.length > 0;
  if (S.step === LAST) return !emptySlots().length;
  return true;
}

// ---- Живі ціни: документ prices/current у сховищі артефакту (оновлює запланована задача на ПК) ----
let DB = null, REFRESH = null, RF_MSG = "";
const fmtD = iso => { try { return new Date(iso).toLocaleString("uk-UA", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } };
// Документ: {updated: ISO, p: {atb: {id: ціна}, silpo: {...}, metro: {...}}} — лише ціни; назви/фасування вбудовані в сторінку
function validPrices(d) { return d && typeof d.updated === "string" && d.p && typeof d.p === "object"; }
function applyPrices(d) {
  const np = { ...PRICES, updated: d.updated, source: "live", stores: {} };
  for (const st in PRICES.stores) { np.stores[st] = {}; for (const id in PRICES.stores[st]) {
    const v = d.p[st] && d.p[st][id]; np.stores[st][id] = typeof v === "number" && v > 0 && v < 100000 ? { ...PRICES.stores[st][id], p: v } : PRICES.stores[st][id]; } }
  PRICES = np;
}
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const db = await claude.use("db"); if (!db) return; DB = db;
    db.doc("prices/current").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (validPrices(d) && (!PRICES.updated || d.updated > PRICES.updated)) { applyPrices(d); if (S.step >= 9 && !S.open && !S.book) render(); }
    }, () => {});
    db.doc("meta/refresh").onSnapshot(snap => { REFRESH = snap.exists ? snap.data() : null; if (S.step >= 9 && !S.open && !S.book) render(); }, () => {});
  } catch (e) {}
})();
// ---- Режим окремого сайту (PWA): ціни з prices.json поруч зі сторінкою ----
const IS_SITE = /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
async function loadSitePrices(manual) {
  try {
    const r = await fetch("prices.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0; const d = await r.json();
    if (validPrices(d) && (!PRICES.updated || d.updated >= PRICES.updated)) applyPrices(d);
    if (manual) RF_MSG = "Ціни перевірено ✓ Актуальні на " + fmtD(PRICES.updated) + ".";
  } catch (e) { if (manual) RF_MSG = "Немає інтернету — показую збережені ціни."; }
  if (manual || (S.step >= 9 && !S.open && !S.book)) render();
}
if (IS_SITE) {
  loadSitePrices(false);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
async function requestRefresh() {
  if (IS_SITE) { await loadSitePrices(true); return; }
  if (!DB) { RF_MSG = "Оновлення недоступне в цьому перегляді — відкрийте застосунок, увійшовши в Claude."; render(); return; }
  try {
    await DB.doc("meta/refresh").set({ requestedAt: new Date().toISOString(), status: "pending", lastDone: REFRESH && REFRESH.lastDone || PRICES.updated || null });
    const snap = await DB.doc("prices/current").get(); const d = snap.exists ? snap.data() : null;
    if (validPrices(d) && d.updated > (PRICES.updated || "")) applyPrices(d);
    RF_MSG = "Запит надіслано ✓ Ціни оновить ваш комп'ютер під час найближчого запуску, і вони з'являться тут самі.";
  } catch (e) { RF_MSG = "Не вдалося надіслати запит. Спробуйте пізніше."; }
  render();
}
function refreshBox() {
  const pend = REFRESH && REFRESH.status === "pending";
  const st = pend ? `⏳ запит від ${fmtD(REFRESH.requestedAt)}` : REFRESH && REFRESH.status === "error" ? `⚠ останнє оновлення не вдалося` : "";
  return `<div class="rf"><button onclick="requestRefresh()" ${pend ? "disabled" : ""}>🔄 Оновити ціни</button><span style="color:var(--m)">Ціни від ${PRICES.updated ? fmtD(PRICES.updated) : "—"}${st ? "<br>" + st : ""}</span></div>${RF_MSG ? `<div class="note" style="margin-top:6px">${esc(RF_MSG)}</div>` : ""}`;
}
function priceNote() {
  const d = PRICES.updated ? new Date(PRICES.updated).toLocaleDateString("uk-UA") : null;
  return PRICES.source === "demo" || !d ? "Ціни орієнтовні (демо)."
    : `Ціни з сайтів АТБ, Сільпо і METRO станом на ${d} (з урахуванням поточних акцій). У конкретному магазині ціна може відрізнятися.`;
}

function render() {
  const a = $("app");
  if (S.step <= LAST) {
    a.innerHTML = `<div style="display:flex;align-items:center;gap:12px">${S.step ? `<button class="back" aria-label="назад" onclick="S.step--;render()">←</button>` : ""}<div class="bar" style="flex:1;margin:0"><i style="width:${(S.step+1)/steps.length*100}%"></i></div></div><div style="height:22px"></div>${steps[S.step]()}
    <div class="foot"><button class="btn" ${canNext()?"":"disabled"} onclick="next()">${S.step===LAST ? "Скласти меню" : "Далі"}</button></div>`;
    return;
  }
  if (S.step === 8) {
    a.innerHTML = `<div class="load"><div class="logo">🛒 кошик</div><div class="sub" style="margin-top:30px">Складаємо ваш тиждень…</div><ul style="padding:0"><li>✅ Підбираємо сніданки, обіди, вечері й перекуси</li><li>✅ Беремо товари й ціни ${stName(S.prefs.store)}</li><li>⏳ Вкладаємось у бюджет і збираємо список</li></ul></div>`;
    return;
  }
  if (S.open) return recipe();
  if (S.book) return book();
  const st = S.prefs.store, ids = Core.flat(S.plan), c = Core.cost(ids, ctx(), st);
  const others = Object.keys(ST).filter(k => k !== st).map(k => { const x = Core.cost(ids, ctx(), k), d = Math.round(x.total - c.total);
    return `${ST[k]}: <b>${Math.round(x.total)} ₴</b> ${d > 0 ? `<span class="ok">(+${d})</span>` : d < 0 ? `<span class="warn">(−${-d})</span>` : ""}${x.missing.length ? `<span class="warn" title="немає ціни для ${x.missing.length} товарів">*</span>` : ""}`; }).join(" · ");
  const avg = Math.round(S.plan.reduce((s, d) => s + Core.dayMacro(d, RC)[0], 0) / S.plan.length);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">Ваш тиждень</h1><button class="back" style="font-size:14px" onclick="S.step=0;S.plan=[];save();render()">⚙️ Змінити</button></div>
  <div class="tabs" style="margin-top:14px">${[...Object.entries(ST), ["mix", "🧺 Разом"]].map(([k,v]) => `<button class="${st===k?"on":""}" onclick="S.prefs.store='${k}';${k==="mix" && S.prefs.mixStores.length < 2 ? "S.prefs.mixStores=['atb','silpo','metro'];" : ""}save();render()">${v}</button>`).join("")}</div>
  <div class="sum"><div class="tot ${c.total<=S.prefs.budget?"ok":"bad"}">${Math.round(c.total)} ₴ <span style="font-size:14px;font-weight:400;color:var(--m)">з ${S.prefs.budget} ₴</span></div>
  ${c.total > S.prefs.budget ? `<div class="bad" style="margin:4px 0">Перевищення на ${Math.round(c.total - S.prefs.budget)} ₴ — збільште бюджет, зменште кількість днів або прийомів їжі.</div>` : ""}
  ${c.stock >= 20 ? `<div style="margin:2px 0 4px">🧊 з них ≈${Math.round(c.stock)} ₴ — залишок напівфабрикатів у морозилці на наступні тижні</div>` : ""}
  ${S.plan.length} дн. · ${ids.length} страв · супів: ${ids.filter(id => rec(id).soup).length} · напівфабрикатів: ${ids.filter(id => rec(id).semi).length} · ${S.prefs.people} ${people(S.prefs.people)} · ≈${avg} ккал/день на людину${st === "mix" ? `<div style="margin:4px 0">${Object.entries(c.byStore).map(([k, v]) => `${ICON[k]} ${ST[k]}: <b>${Math.round(v)} ₴</b>`).join(" · ")}</div>${mixSaving(ids, c)}` : ""}<br>${st === "mix" ? "Якщо купувати в одній мережі" : "Той самий кошик"}: ${others}
  ${refreshBox()}
  ${c.missing.length ? `<div class="warn" style="margin-top:4px">Немає в цій мережі: ${c.missing.map(p => esc(PR[p].name)).join(", ")} — не враховано в сумі.</div>` : ""}</div>
  <div class="tabs"><button class="${S.tab==="plan"?"on":""}" onclick="S.tab='plan';render()">Меню</button><button class="${S.tab==="prep"?"on":""}" onclick="S.tab='prep';render()">Заготовки</button><button class="${S.tab==="list"?"on":""}" onclick="S.tab='list';render()">Покупки</button></div>`;
  if (S.tab === "plan") {
    const d = Math.min(S.day, S.plan.length - 1), day = S.plan[d], m = Core.dayMacro(day, RC);
    h += `<div class="days">${S.plan.map((_, i) => `<button class="${i===d?"on":""}" onclick="S.day=${i};render()">${DS[i]}</button>`).join("")}</div>
    <div class="dayhead"><b>${DAYS[d]}</b><span>${m[0]} ккал · Б ${m[1]} · Ж ${m[2]} · В ${m[3]} г</span></div>`;
    h += Core.SLOTS.filter(s => day[s] != null).map(s => { const r = rec(day[s]), key = d + "-" + s;
      return `<div class="meal ${S.done[key]?"done":""}" role="button" tabindex="0" onclick="S.open={d:${d},s:'${s}'};render()"><div class="em">${r.emoji}</div><div><div class="d">${SL[s][0]} ${SL[s][1]}</div><div class="n">${esc(r.name)}</div><div class="k">${r.macro[0]} ккал · Б ${r.macro[1]} г · ${r.time} хв</div></div></div>`; }).join("");
  } else if (S.tab === "prep") {
    const pp = Core.prepPlan(S.plan, ctx());
    h += pp.length ? `<div class="sub" style="margin:0 0 6px">Готуйте наперед 1–2 рази на тиждень, щоб у будні лише розігрівати й збирати страви.</div>` + pp.map((ses, w) => `<div class="prep"><div class="ph"><b>🔪 ${ses.title}</b><span>≈ ${Math.round(ses.minutes / 5) * 5} хв</span></div>` +
      ses.tasks.map(t => { const key = "p" + w + t.key; return `<label class="item ${S.ck[key]?"ck":""}" style="align-items:flex-start"><input type="checkbox" ${S.ck[key]?"checked":""} onchange="S.ck['${key}']=this.checked;save();render()"><span><b>${esc(t.text)}</b>${t.qty ? ` — ${esc(t.qty)}` : ""}<br><small style="color:var(--m)">${esc(t.how)}</small><br><small style="color:var(--gd)">Для: ${t.dishes.map(esc).join(", ")}</small>${t.warn ? `<br><small class="warn">⚠ ${esc(t.warn)}</small>` : ""}</span></label>`; }).join("") + `</div>`).join("")
      : `<p class="sub">Для цього меню заготовки не потрібні — усі страви швидкі.</p>`;
  } else {
    let lastSt = "";
    h += Core.shoppingList(ids, ctx(), st).map(g => { const head = g.store !== undefined && g.store !== lastSt ? (lastSt = g.store, `<h2 style="margin-top:22px">${g.store ? ICON[g.store] + " " + ST[g.store] + ` <span style="font-size:14px;font-weight:400;color:var(--m)">${Math.round(c.byStore[g.store] || 0)} ₴</span>` : "Немає в обраних мережах"}</h2>`) : "";
      return head + `<div class="cat">${esc(g.cat)}</div>` + g.items.map(it =>
      `<label class="item ${S.ck[it.id]?"ck":""}"><input type="checkbox" ${S.ck[it.id]?"checked":""} onchange="S.ck['${it.id}']=this.checked;save();render()"><span>${esc(it.title || it.name)} <small style="color:var(--m)">${qtyText(it)}${it.left ? ` · 🧊 залишок ≈${it.left >= 1000 ? (it.left/1000).toLocaleString("uk-UA") + " кг" : it.left + " г"}` : ""}</small>${it.url ? ` <a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:var(--gd);font-size:12px" onclick="event.stopPropagation()">↗</a>` : ""}</span><span class="p">${it.sum===null?"немає":Math.round(it.sum)+" ₴"}</span></label>`).join(""); }).join("");
    h += `<div class="row"><button class="btn sec" onclick="copyList()">📋 Копіювати список</button></div><div id="cp" class="note" aria-live="polite"></div>`;
  }
  h += `<div class="row"><button class="btn sec" onclick="S.book=true;S.bookQ='';render()">📖 Усі рецепти (${RC.length})</button></div><p class="note">${priceNote()}</p>`;
  a.innerHTML = h;
}

function book() {
  const q = (S.bookQ || "").toLowerCase();
  const TAG = Object.fromEntries(MOODS.map(([k, e, t]) => [k, e]));
  $("app").innerHTML = `<button class="back" aria-label="назад" onclick="S.book=false;render()">←</button><h1 style="margin-top:8px">Усі рецепти</h1>
  <input id="bq" type="search" placeholder="Пошук страви або продукту" value="${esc(S.bookQ || "")}" style="width:100%;padding:12px 14px;border:1.5px solid var(--b);border-radius:14px;font-size:15px;margin-bottom:6px">
  <div class="note" style="margin:0 0 6px">${MOODS.map(([k, e, t]) => `${e} ${t}`).join(" · ")} · 🍲 суп · 🧊 напівфабрикат</div>` +
  Core.SLOTS.map(sl => { const list = RC.filter(r => r.meals.includes(sl) && (!q || r.name.toLowerCase().includes(q) || r.ing.some(([p]) => PR[p].name.toLowerCase().includes(q))));
    return list.length ? `<div class="cat">${SL[sl][0]} ${SL[sl][1]} · ${list.length}</div>` + list.map(r => `<div class="meal" role="button" tabindex="0" onclick="S.open={rid:${r.id}};render()"><div class="em">${r.emoji}</div><div><div class="n">${esc(r.name)}</div><div class="k">${r.macro[0]} ккал · Б ${r.macro[1]} г · ${r.time} хв · ${r.tags.map(t => TAG[t] || "").join("")}${r.soup ? "🍲" : ""}${r.semi ? "🧊" : ""}</div></div></div>`).join("") : ""; }).join("");
  const inp = $("bq"); inp.oninput = () => { S.bookQ = inp.value; const pos = inp.selectionStart; book(); const i2 = $("bq"); i2.focus(); i2.setSelectionRange(pos, pos); };
}
function recipe() {
  if (S.open.rid != null) return recipeView(rec(S.open.rid), null, null);
  return recipeView(rec(S.plan[S.open.d][S.open.s]), S.open.d, S.open.s);
}
function recipeView(r, d, s) {
  const n = S.prefs.people, key = d + "-" + s, inPlan = d !== null;
  $("app").innerHTML = `<button class="back" aria-label="назад" onclick="S.open=null;render()">←</button><div class="hero" style="margin-top:10px">${r.emoji}</div><h1>${esc(r.name)}</h1><div class="sub">${inPlan ? DAYS[d] + " · " + SL[s][1] + " · " : r.meals.map(m => SL[m][1]).join(" / ") + " · "}${r.time} хв · ${n} ${n===1?"порція":n<5?"порції":"порцій"}</div>
  <div class="macro"><div><b>${r.macro[0]}</b><span>ккал</span></div><div><b>${r.macro[1]} г</b><span>білки</span></div><div><b>${r.macro[2]} г</b><span>жири</span></div><div><b>${r.macro[3]} г</b><span>вуглеводи</span></div></div>
  <div class="note" style="margin-top:0;text-align:center">на 1 порцію</div>
  ${(r.prep || []).filter(k => PREP[k]).length ? `<div class="sum" style="margin-top:10px">💡 Заготовка: ${(r.prep || []).filter(k => PREP[k]).map(k => esc(PREP[k].text.toLowerCase())).join("; ")} — див. вкладку «Заготовки».</div>` : ""}
  <h2>Інгредієнти</h2><ul class="ing">${r.ing.map(([p,q]) => `<li>${esc(PR[p].name)} — ${q*n} ${PR[p].ml?"мл":"г"}</li>`).join("")}<li>Сіль, спеції — за смаком</li></ul>
  <h2>Приготування</h2><ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
  ${inPlan ? `<div class="row"><button class="btn sec" onclick="doSwap(${d},'${s}')">🔄 Замінити страву</button><button class="btn" onclick="S.done['${key}']=!S.done['${key}'];save();S.open=null;render()">${S.done[key]?"Не приготовано":"✓ Приготовано"}</button></div>` : ""}`;
}
function mixSaving(ids, c) {
  const singles = S.prefs.mixStores.map(k => ({ k, x: Core.cost(ids, ctx(), k) })).filter(o => !o.x.missing.length);
  if (!singles.length) return "";
  const best = singles.sort((a, b) => a.x.total - b.x.total)[0], d = Math.round(best.x.total - c.total);
  return d > 0 ? `<div class="ok">💰 Економія ${d} ₴ порівняно з найдешевшою однією мережею (${ST[best.k]})</div>` : `<div style="color:var(--m)">Вигідніше купити все в ${ST[best.k]} — поріг економії не досягнуто</div>`;
}
function qtyText(it) {
  if (it.sum === null) return "";
  if (it.kg) return it.qty >= 1000 ? (it.qty / 1000).toLocaleString("uk-UA") + " кг" : it.qty + " г";
  return it.packs > 1 ? "× " + it.packs : "";
}
function doSwap(d, s) { S.plan = Core.swap(S.plan, d, s, ctx()); delete S.done[d + "-" + s]; save(); render(); }
function next() {
  if (!canNext()) return;
  if (S.step < LAST) { S.step++; render(); return; }
  S.step = 8; render();
  setTimeout(() => { S.plan = Core.generate(ctx()); S.done = {}; S.ck = {}; S.day = 0; S.step = 9; S.tab = "plan"; save(); render(); }, 1200);
}
function copyList() {
  let last = ""; const t = `Список покупок (${stName(S.prefs.store)}):\n` + Core.shoppingList(Core.flat(S.plan), ctx(), S.prefs.store).flatMap(g => {
    const head = g.store !== undefined && g.store !== last ? [(last = g.store, `\n${g.store ? ST[g.store] : "Немає в обраних мережах"}:`)] : [];
    return head.concat(g.items.map(it => `- ${it.title || it.name} ${qtyText(it)}`)); }).join("\n");
  try { navigator.clipboard.writeText(t).then(() => $("cp").textContent = "Скопійовано ✓", () => $("cp").textContent = "Не вдалося скопіювати"); }
  catch (e) { $("cp").textContent = "Не вдалося скопіювати"; }
}
render();
</script></body></html>
