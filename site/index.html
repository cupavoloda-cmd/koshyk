<script>// Чиста логіка планувальника. Працює і в Node (тести), і в браузері (window.Core).
(function (root) {
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

  }
  // ціна порції за ціною грама (без округлення упаковок) — лише для зважування вибору
  function portionCost(ctx) {
    const st = ctx.prefs.store === "mix" ? (ctx.prefs.mixStores || ["atb", "silpo", "metro"]) : [ctx.prefs.store], m = {};
    const gp = pid => { let b = Infinity; st.forEach(x => { const it = itemOf(ctx.prices, x, pid); if (it) b = Math.min(b, it.p / (it.kg ? 1000 : it.pack)); }); return b === Infinity ? 0 : b; };
    ctx.recipes.forEach(r => m[r.id] = r.ing.reduce((a, [pid, g]) => a + gp(pid) * g, 0) || 1);
    return m;
  }
  function wshuffle(arr, rng, alpha, pc) {
    return arr.map(id => [Math.pow(rng(), 1 / Math.pow(pc[id], alpha)), id]).sort((a, b) => b[0] - a[0]).map(x => x[1]);
  }
  function shuffle(arr, rng) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const byId = (recipes, id) => recipes.find(r => r.id === id);

  function allowed(recipe, prefs) {
    if (recipe.semi && (prefs.semiMax ?? 3) === 0) return false;
    if (recipe.contains.some(d => prefs.dislikes.includes(d))) return false;
    return recipe.appliances.length === 0 || recipe.appliances.some(a => prefs.appliances.includes(a));
  }
  function needs(ids, recipes, people) {
    const g = {};
    ids.forEach(id => byId(recipes, id).ing.forEach(([p, q]) => { g[p] = (g[p] || 0) + q * people; }));
    return g;
  }
  // Позиція мережі: {p: ціна, pack: г/мл в упаковці} або {p: ціна за кг, kg: true} (ваговий товар)
  function itemOf(prices, store, pid) {
    const v = prices.stores[store] && prices.stores[store][pid];
    return v && typeof v.p === "number" && v.p > 0 && (v.kg || v.pack > 0) ? v : null;
  }
  // Ваговий товар: купується цілими штуками, якщо в продукту є unitG (головка капусти, лимон, рибина), інакше з кроком 50 г
  function lineCost(it, need, prod) {
    if (it.kg) { const step = prod && prod.unitG || 50, g = Math.ceil(need / step) * step;
      return { qty: g, packs: null, pcs: prod && prod.unitG ? g / step : null, sum: Math.round(it.p * g / 10) / 100, oldSum: it.old ? Math.round(it.old * g / 10) / 100 : null }; }
    const packs = Math.ceil(need / it.pack); return { qty: packs * it.pack, packs, sum: Math.round(packs * it.p * 100) / 100, oldSum: it.old ? Math.round(packs * it.old * 100) / 100 : null };
  }
  // Змішаний кошик (store === "mix"): кожен продукт — у мережі, де він найдешевший, серед prefs.mixStores.
  // Мережа лишається в кошику, лише якщо економія в ній ≥ prefs.minSave (щоб не їхати в магазин заради дрібниці).
  const effCost = (it, need, prod) => { const lc = lineCost(it, need, prod); return lc.sum - (prod.frozen && !it.kg && lc.qty > need ? 0.8 * lc.sum * (lc.qty - need) / lc.qty : 0); };
  function assign(g, ctx) {
    let allowed = (ctx.prefs.mixStores || ["atb", "silpo", "metro"]).filter(s => ctx.prices.stores[s]);
    const minSave = ctx.prefs.minSave ?? 50;
    for (;;) {
      const asg = {}, save = {}; allowed.forEach(s => save[s] = 0);
      for (const p in g) {
        const opts = allowed.map(s => { const it = itemOf(ctx.prices, s, p); return it ? { s, c: effCost(it, g[p], ctx.products[p]) } : null; }).filter(Boolean).sort((x, y) => x.c - y.c);
        if (!opts.length) continue;
        asg[p] = opts[0].s;
        save[opts[0].s] += opts.length > 1 ? opts[1].c - opts[0].c : 1e6;     // єдина мережа з товаром — її не прибираємо
      }
      if (allowed.length < 2) return { asg, stores: allowed };
      const used = allowed.filter(s => Object.values(asg).includes(s));
      const weak = used.filter(s => save[s] < minSave).sort((x, y) => save[x] - save[y])[0];
      if (!weak || used.length < 2) return { asg, stores: used };
      allowed = allowed.filter(s => s !== weak);
    }
  }
  function cost(ids, ctx, store) {
    const g = needs(ids, ctx.recipes, ctx.prefs.people);
    const asg = store === "mix" ? assign(g, ctx).asg : null;
    let total = 0, stock = 0, promo = 0, promoN = 0, eaten = 0; const missing = [], byStore = {};
    for (const p in g) {
      const st = asg ? asg[p] : store, it = st ? itemOf(ctx.prices, st, p) : null;
      if (!it) { missing.push(p); continue; }
      const lc = lineCost(it, g[p], ctx.products[p]); total += lc.sum; byStore[st] = (byStore[st] || 0) + lc.sum;
      eaten += it.kg ? it.p * g[p] / 1000 : it.p * g[p] / it.pack;
      if (lc.oldSum > lc.sum) { promo += lc.oldSum - lc.sum; promoN++; }  // економія на акціях
      if (ctx.products[p].frozen && !it.kg && lc.qty > g[p]) stock += lc.sum * (lc.qty - g[p]) / lc.qty; // залишок іде в морозилку
    }
    for (const k in byStore) byStore[k] = Math.round(byStore[k] * 100) / 100;
    return { total: Math.round(total * 100) / 100, stock: Math.round(stock * 100) / 100, missing, byStore, promo: Math.round(promo), promoN, eaten: Math.round(eaten) };
  }
  const SLOTS = ["breakfast", "lunch", "dinner", "snack"];
  // План: масив днів [{breakfast: id, lunch: id, dinner: id, snack: id}] — лише обрані прийоми (prefs.slots)
  const flat = plan => plan.flatMap(d => SLOTS.filter(s => d[s] != null).map(s => d[s]));
  const slotsOf = prefs => SLOTS.filter(s => (prefs.slots || ["dinner"]).includes(s));
  function poolFor(slot, ctx) { return ctx.recipes.filter(r => (r.meals || ["dinner"]).includes(slot) && allowed(r, ctx.prefs)).map(r => r.id); }
  function moodScore(ids, recipes, moods) {
    return ids.reduce((s, id) => s + byId(recipes, id).tags.filter(t => moods.includes(t)).length, 0);
  }
  function objective(plan, ctx) {
    const ids = flat(plan), cc = cost(ids, ctx, ctx.prefs.store), c = cc.total - cc.stock * 0.8; // запас у морозилці майже не «з'їдає» бюджет
    const over = Math.max(0, c - ctx.prefs.budget);
    let pen = 0;
    plan.forEach((d, i) => {
      if (d.lunch != null && d.lunch === d.dinner) pen += 40;                      // однакове на обід і вечерю
      if (d.lunch != null && d.dinner != null) {                                // обід і вечеря — різне м'ясо/риба
        const pr = id => byId(ctx.recipes, id).contains.filter(x => ["chicken", "pork", "fish"].includes(x)).join();
        const a = pr(d.lunch), b = pr(d.dinner); if (a && a === b) pen += 12;
        const base = id => byId(ctx.recipes, id).name.split(" з ")[0];      // одна й та сама основа («Печериці в сметані з …»)
        if (base(d.lunch) === base(d.dinner)) pen += 30;
      }
      const p = plan[i - 1]; if (p) SLOTS.forEach(s => { if (d[s] != null && d[s] === p[s]) pen += 15; }); // те саме два дні поспіль
    });
    const repeats = ids.length - new Set(ids).size;
    const soups = ids.filter(id => byId(ctx.recipes, id).soup).length;
    pen += Math.max(0, soups - (ctx.prefs.maxSoups ?? 2)) * 60;               // не більше 2 супів на тиждень
    pen += cc.missing.length * 120;                                          // товару немає в обраній мережі
    const semi = ids.filter(id => byId(ctx.recipes, id).semi).length;
    pen += Math.max(0, semi - (ctx.prefs.semiMax ?? 3)) * 60;                 // напівфабрикати — не частіше за вибране
    // більший бюджет → дорожчі страви: тягнемося до ~92% бюджету, а зайве — на з'їдене (не на залишки упаковок)
    const under = Math.max(0, ctx.prefs.budget * 0.92 - c);
    return moodScore(ids, ctx.recipes, ctx.prefs.moods) * 4 - over * 3 - pen - repeats * 8 - under / 8 + cc.eaten / 60;
  }
  function generate(ctx, rng = mulberry32(Date.now() & 0xffffffff), iterations = 500) {
    const slots = slotsOf(ctx.prefs), pools = {};
    for (const s of slots) { pools[s] = poolFor(s, ctx); if (!pools[s].length) return []; }
    // більший бюджет → частіше дорожчі страви: зважене перемішування за ціною порції (від ~2500 ₴/люд./тиж.)
    const perPerson = ctx.prefs.budget / (1 + ((ctx.prefs.people || 1) - 1) * 0.8), alpha = Math.min(3, Math.max(0, (perPerson - 2500) / 1500));
    const pc = alpha ? portionCost(ctx) : null;
    let best = null, bestScore = -Infinity;
    for (let k = 0; k < iterations; k++) {
      const order = {}; slots.forEach(s => order[s] = alpha ? wshuffle(pools[s], rng, alpha, pc) : shuffle(pools[s], rng));
      const plan = Array.from({ length: ctx.prefs.days }, (_, i) => { const d = {}; slots.forEach(s => d[s] = order[s][(i + (s === "dinner" ? Math.floor(order[s].length / 2) : 0)) % order[s].length]); return d; });
      const sc = objective(plan, ctx);
      if (sc > bestScore) { bestScore = sc; best = plan; }
    }
    return best;
  }
  function swap(plan, day, slot, ctx) {
    const pool = poolFor(slot, ctx).filter(id => id !== plan[day][slot]);
    if (!pool.length) return plan;
    const used = new Set(flat(plan)), fresh = pool.filter(id => !used.has(id)), cands = fresh.length ? fresh : pool;
    // заміна не робить меню дорожчим: серед варіантів не дорожчих за поточний — найкращий; якщо таких нема — найдешевший
    const st = ctx.prefs.store, tot = p => cost(flat(p), ctx, st).total, cur = tot(plan) + 0.5;
    const opts = cands.map(id => { const p = plan.map(d => ({ ...d })); p[day][slot] = id; return { p, t: tot(p) }; });
    const ok = opts.filter(o => o.t <= cur);
    if (!ok.length) return opts.reduce((a, b) => b.t < a.t ? b : a).p;
    let best = ok[0].p, bestScore = -Infinity;
    ok.forEach(o => { const sc = objective(o.p, ctx); if (sc > bestScore) { bestScore = sc; best = o.p; } });
    return best;
  }
  function shoppingList(ids, ctx, store) {
    const g = needs(ids, ctx.recipes, ctx.prefs.people);
    const asg = store === "mix" ? assign(g, ctx).asg : null, order = ["atb", "silpo", "metro"];
    const groups = {};
    for (const p in g) {
      const st = asg ? asg[p] || null : store, prod = ctx.products[p], it = st ? itemOf(ctx.prices, st, p) : null, lc = it ? lineCost(it, g[p], prod) : null;
      const key = (asg ? (st || "zz") + "|" : "") + prod.cat;
      (groups[key] = groups[key] || { cat: prod.cat, store: asg ? st : undefined, items: [] }).items.push({ id: p, name: prod.name, title: it ? it.t : null, url: it ? it.url : null, kg: it ? !!it.kg : false,
        packs: lc ? lc.packs : null, qty: lc ? lc.qty : null, pcs: lc ? lc.pcs : null, unitName: prod.unitName || null, oldSum: lc && lc.oldSum > lc.sum ? lc.oldSum : null,
        promoPct: it && it.old > it.p ? Math.round((1 - it.p / it.old) * 100) : 0, until: it && it.until || null, need: g[p], sum: lc ? lc.sum : null, store: st,
        left: lc && prod.frozen && !it.kg && lc.qty > g[p] ? Math.round(lc.qty - g[p]) : 0 });
    }
    const rank = x => x.store === undefined ? 0 : x.store === null ? 99 : order.indexOf(x.store);
    return Object.values(groups).sort((a, b) => rank(a) - rank(b) || a.cat.localeCompare(b.cat, "uk"))
      .map(gr => ({ ...gr, items: gr.items.sort((a, b) => a.name.localeCompare(b.name, "uk")) }));
  }
  function avgKcal(ids, recipes) {
    return ids.length ? Math.round(ids.reduce((s, id) => s + byId(recipes, id).macro[0], 0) / ids.length) : 0;
  }
  // План заготовок: 1 сесія на ≤3 дні, інакше дві (перед Пн — на Пн–Ср, у Ср ввечері — на Чт–Нд)
  function prepPlan(plan, ctx) {
    const prep = ctx.prep || {}, n = plan.length, people = ctx.prefs.people;
    const windows = n <= 3 ? [[0, n]] : [[0, 3], [3, n]];
    const names = ["Нд ввечері (на Пн–Ср)", "Ср ввечері (на Чт–Нд)"];
    return windows.map(([a, b], w) => {
      const tasks = {};
      for (let d = a; d < b; d++) SLOTS.forEach(s => {
        const id = plan[d][s]; if (id == null) return; const r = byId(ctx.recipes, id);
        (r.prep || []).forEach(k => {
          if (!prep[k]) return;
          const t = tasks[k] = tasks[k] || { key: k, text: prep[k].text, how: prep[k].how, min: prep[k].min, keeps: prep[k].keeps, dishes: [], grams: {} };
          if (!t.dishes.includes(r.name)) t.dishes.push(r.name);
          r.ing.forEach(([p, q]) => {
            if (k === "grain" && (prep.grain.grains || []).includes(p)) t.grams[p] = (t.grams[p] || 0) + q * people;
            if (k === "boil_eggs" && p === "eggs") t.grams.eggs = (t.grams.eggs || 0) + q * people;
          });
          if (d - a + 1 > prep[k].keeps) t.warn = `зберігається ${prep[k].keeps} дн. — для «${r.name}» (${["Пн","Вт","Ср","Чт","Пт","Сб","Нд"][d]}) частину заморозьте або приготуйте в день подачі`;
        });
      });
      const list = Object.values(tasks).map(t => {
        let qty = "";
        if (t.key === "grain") qty = Object.entries(t.grams).map(([p, g]) => `${ctx.products[p].name.toLowerCase()} — ${Math.round(g)} г сухої`).join(", ");
        if (t.key === "boil_eggs") qty = `${Math.ceil(t.grams.eggs / 60)} шт`;
        return { key: t.key, text: t.text, how: t.how, min: t.min, qty, dishes: t.dishes, warn: t.warn || null };
      });
      return { title: n <= 3 ? "Перед початком" : names[w], from: a, to: b - 1, tasks: list, minutes: list.reduce((m, t) => m + t.min, 0) };
    }).filter(x => x.tasks.length);
  }
  function dayMacro(day, recipes) {
    return SLOTS.filter(s => day[s] != null).reduce((m, s) => byId(recipes, day[s]).macro.map((v, i) => m[i] + v), [0, 0, 0, 0]);
  }
  const api = { prepPlan, dayMacro, SLOTS, flat, slotsOf, poolFor, mulberry32, itemOf, lineCost, allowed, needs, cost, generate, swap, shoppingList, avgKcal, objective };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.Core = api;
})(typeof window !== "undefined" ? window : globalThis);

",150],["rice",70],["lemon",20],["oil",8]],"macro":[670,39,29,64],"steps":["Відваріть рис (15 хв).","Викладіть лосось і броколі на деко, збризніть олією й лимоном, посоліть.","Запікайте 15–18 хв при 200 °C.","Подавайте з рисом."],"meals":["lunch","dinner"],"prep":["grain"]},{"id":1242,"name":"Стейк з яловичини з картоплею по-селянськи","emoji":"🥩🥔","time":40,"tags":["comfort","protein"],"appliances":["stove","oven"],"contains":[],"ing":[["beef",180],["potato",250],["oil",12],["garlic",5],["dill",5]],"macro":[616,50,27,43],"steps":["Наріжте картоплю часточками, змастіть олією, запікайте 30 хв при 200 °C.","Стейк обсушіть, посоліть і обсмажте на дуже гарячій пательні по 3–4 хв з кожного боку.","Додайте часник, дайте м'ясу відпочити 5 хв.","Подавайте з картоплею й зеленню."],"meals":["lunch","dinner"]},{"id":1243,"name":"Паста з креветками й часником","emoji":"🍤🍝","time":20,"tags":["fast","protein"],"appliances":["stove"],"contains":["dairy","fish"],"ing":[["shrimp",120],["pasta",90],["garlic",8],["butter",10],["tomato",100],["dill",5]],"macro":[528,39,9,72],"steps":["Відваріть пасту.","На вершковому маслі прогрійте часник 1 хв, додайте нарізані помідори.","Додайте креветки, готуйте 3 хв.","Змішайте з пастою, посипте зеленню."],"meals":["lunch","dinner"]},{"id":1244,"name":"Лосось на пательні з булгуром та овочами","emoji":"🐟🫑","time":25,"tags":["fast","protein"],"appliances":["stove"],"contains":["fish"],"ing":[["salmon",150],["bulgur",70],["zucchini",120],["pepper",80],["oil",8]],"macro":[674,40,29,50],"steps":["Залийте булгур окропом удвічі, варіть 10 хв.","Обсмажте лосось шкірою донизу 4 хв, переверніть ще на 2 хв.","На тій самій пательні обсмажте кабачок і перець.","Подавайте разом."],"meals":["lunch","dinner"],"prep":["grain","chop"]},{"id":1245,"name":"Яловичина з овочами вок і рисом","emoji":"🥩🍚","time":25,"tags":["fast","protein"],"appliances":["stove"],"contains":[],"ing":[["beef",150],["rice",70],["pepper",80],["carrot",60],["onion",40],["oil",10]],"macro":[645,45,23,67],"steps":["Відваріть рис.","Наріжте яловичину тонкими смужками, швидко обсмажте на сильному вогні 3 хв.","Додайте овочі соломкою, смажте ще 4 хв.","Подавайте з рисом."],"meals":["lunch","dinner"],"prep":["grain","chop"]},{"id":1246,"name":"Смажений рис з креветками та яйцем","emoji":"🍤🍳","time":20,"tags":["fast","protein"],"appliances":["stove"],"contains":["eggs","fish"],"ing":[["shrimp",120],["rice",80],["eggs",50],["corn",40],["peas",40],["oil",10],["greenonion",10]],"macro":[603,43,16,73],"steps":["Відваріть рис заздалегідь (краще вчорашній).","Обсмажте креветки 2 хв, відсуньте, засмажте яйце.","Додайте рис, кукурудзу й горошок, смажте 4 хв.","Посипте зеленою цибулею."],"meals":["lunch","dinner"],"prep":["grain"]},{"id":1247,"name":"Паста з лососем у вершковому соусі","emoji":"🐟🍝","time":25,"tags":["comfort","protein"],"appliances":["stove"],"contains":["dairy","fish"],"ing":[["salmon",120],["pasta",90],["smetana",60],["cheese",20],["dill",5]],"macro":[729,40,31,66],"steps":["Відваріть пасту.","Наріжте лосось кубиками, обсмажте 3 хв.","Додайте сметану й тертий сир, прогрійте 2 хв.","Змішайте з пастою, посипте кропом."],"meals":["lunch","dinner"]},{"id":1248,"name":"Салат з креветками та авокадо","emoji":"🥑🍤","time":15,"tags":["fast","lowcal","protein"],"appliances":[],"contains":["fish"],"ing":[["shrimp",100],["avocado",100],["tomato",120],["cucumber",100],["lemon",15],["oil",10]],"macro":[390,28,26,17],"steps":["Розморозьте варені креветки.","Наріжте авокадо, помідори й огірок.","Заправте олією й лимонним соком, посоліть.","Викладіть креветки зверху."],"meals":["lunch","dinner"]},{"id":1249,"name":"Стейк з яловичини з овочами гриль","emoji":"🥩🫑","time":30,"tags":["lowcal","protein"],"appliances":["stove"],"contains":[],"ing":[["beef",180],["zucchini",150],["pepper",100],["tomato",100],["oil",10]],"macro":[479,48,25,16],"steps":["Наріжте овочі пластинами й обсмажте на гриль-пательні.","Стейк посоліть і обсмажте по 3–4 хв з кожного боку.","Дайте відп const LAST = steps.length - 1;
function canNext() {
  if (S.step === 1 && S.prefs.store === "mix") return S.prefs.mixStores.length >= 2;
  if (S.step === 2) return S.prefs.slots.length > 0;
  if (S.step === LAST) return !emptySlots().length;
  return true;
}

// ---- Живі ціни: документ prices/current у сховищі артефакту (оновлює запланована задача на ПК) ----
let DB = null, REFRESH = null, RF_MSG = "";
const fmtD = iso => { try { return new Date(iso).toLocaleString("uk-UA", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } };
// Документ: {updated: ISO, p: {atb: {id: ціна}, silpo: {...}, metro: {...}}} — лише ціни; назви/фасування вбудовані в сторінку
const newer = (a, b, eq) => { const x = Date.parse(a), y = Date.parse(b); return !(y >= 0) || (eq ? x >= y : x > y); }; // порівнюємо як час, не як текст
function validPrices(d) { return d && typeof d.updated === "string" && d.p && typeof d.p === "object"; }
function applyPrices(d) {
  const np = { ...PRICES, updated: d.updated, source: "live", stores: {} };
  for (const st in PRICES.stores) { np.stores[st] = {}; for (const id in PRICES.stores[st]) {
    const v = d.p[st] && d.p[st][id], base = PRICES.stores[st][id];
    if (typeof v === "number" && v > 0 && v < 100000) {
      const o = d.old && d.old[st] && d.old[st][id], u = d.until && d.until[st] && d.until[st][id];
      const n = { ...base, p: v }; delete n.old; delete n.until;
      if (typeof o === "number" && o > v) n.old = o; if (typeof u === "string") n.until = u;
      np.stores[st][id] = n;
    } else np.stores[st][id] = base; } }
  PRICES = np;
}
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const db = await claude.use("db"); if (!db) return; DB = db;
    db.doc("prices/current").onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (validPrices(d) && newer(d.updated, PRICES.updated)) { applyPrices(d); if (S.step >= 9 && !S.open && !S.book) render(); }
    }, () => {});
    db.doc("meta/refresh").onSnapshot(snap => { REFRESH = snap.exists ? snap.data() : null; if (S.step >= 9 && !S.open && !S.book) render(); }, () => {});
  } catch (e) {}
})();
// ---- Режим окремого сайту (PWA): ціни з prices.json поруч зі сторінкою ----
const IS_SITE = /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);
async function loadSitePrices(manual) {
  try {
    const r = await fetch("prices.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0; const d = await r.json();
    if (validPrices(d) && newer(d.updated, PRICES.updated, true)) applyPrices(d);
    if (manual) RF_MSG = "Ціни перевірено ✓ Актуальні на " + fmtD(PRICES.updated) + ".";
  } catch (e) { if (manual) RF_MSG = "Немає інтернету — показую збережені ціни."; }
  if (manual || (S.step >= 9 && !S.open && !S.book)) render();
}
if (IS_SITE) {
  loadSitePrices(false);
  if ("serviceWorker" in navigator) {
    // нова версія: перевіряємо при кожному поверненні в застосунок і одразу перезавантажуємо
    const had = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      document.addEventListener("visibilitychange", () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
  }
}
async function requestRefresh() {
  if (IS_SITE) { await loadSitePrices(true); return; }
  if (!DB) { RF_MSG = "Оновлення недоступне в цьому перегляді — відкрийте застосунок, увійшовши в Claude."; render(); return; }
  try {
    await DB.doc("meta/refresh").set({ requestedAt: new Date().toISOString(), status: "pending", lastDone: REFRESH && REFRESH.lastDone || PRICES.updated || null });
    const snap = await DB.doc("prices/current").get(); const d = snap.exists ? snap.data() : null;
    if (validPrices(d) && newer(d.updated, PRICES.updated)) applyPrices(d);
    RF_MSG = "Запит надіслано ✓ Ціни оновить ваш комп'ютер під час найближчого запуску, і вони з'являться тут самі.";
  } catch (e) { RF_MSG = "Не вдалося надіслати запит. Спробуйте пізніше."; }
  render();
}
function refreshBox() {  // ціни оновлюються автоматично щодня — показуємо лише дату
  return `<div class="rf"><span style="color:var(--m)">🔄 Ціни від ${PRICES.updated ? fmtD(PRICES.updated) : "—"} · оновлюються автоматично щодня</span></div>`;
}
function priceNote() {
  const d = PRICES.updated ? new Date(PRICES.updated).toLocaleDateString("uk-UA") : null;
  return PRICES.source === "demo" || !d ? "Ціни орієнтовні (демо)."
    : `Ціни з сайтів АТБ, Сільпо і METRO станом на ${d} (з урахуванням поточних акцій). У конкретному магазині ціна може відрізнятися.`;
}

      return head + `<div class="cat">${esc(g.cat)}</div><div class="group">` + g.items.map(it =>
      `<label class="item ${S.ck[it.id]?"ck":""}"><input type="checkbox" ${S.ck[it.id]?"checked":""} onchange="S.ck['${it.id}']=this.checked;save();render()"><span>${esc(it.title || it.name)} <small style="color:var(--m)">${qtyText(it)}${it.promoPct ? ` <span class="promo">🏷 −${it.promoPct}%${it.until ? " до " + new Date(it.until).toLocaleDateString("uk-UA", { day: "numeric", month: "numeric" }) : ""}</span>` : ""}${it.left ? ` · 🧊 залишок ≈${it.left >= 1000 ? (it.left/1000).toLocaleString("uk-UA") + " кг" : it.left + " г"}` : ""}</small>${it.url ? ` <a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:var(--tint);font-size:12px" onclick="event.stopPropagation()">↗</a>` : ""}</span><span class="p">${it.sum===null?"немає":Math.round(it.sum)+" ₴"}${it.oldSum ? `<br><s style="color:var(--m);font-weight:400;font-size:12px">${Math.round(it.oldSum)}&nbsp;₴</s>` : ""}</span></label>`).join("") + `</div>`; }).join("");

  set: '<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
};
// ---- Малювання з плавною появою нового екрана ----
let LASTKEY = "", SLIDE = "";
function paint(html, key) {
  const a = $("app"); a.innerHTML = html;
  if (key !== LASTKEY) { a.classList.remove("enter"); void a.offsetWidth; a.classList.add("enter"); if (!key.startsWith("q") || LASTKEY.startsWith("q")) window.scrollTo({ top: 0, behavior: "instant" }); LASTKEY = key; }
}
function tabbar() {
  const T = [["plan", I.menu, "Меню"], ["prep", I.prep, "Заготовки"], ["list", I.cart, "Покупки"], ["book", I.book, "Рецепти"]];
  return `<nav class="tabbar">${T.map(([k, e, t]) => `<button aria-label="${t}" class="${(k === "book" ? S.book : !S.book && S.tab === k) ? "on" : ""}" onclick="S.settings=false;${k === "book" ? "S.book=true;S.bookQ=S.bookQ||''" : `S.book=false;S.tab='${k}'`};render()">${e}<span>${t}</span></button>`).join("")}</nav>`;
}
function settings() {
  paint(`<header class="nav"><div class="navrow"><h1>Налаштування</h1></div></header>
  <div class="setlist"><div class="set"><span>Оформлення</span>${themeBox()}</div></div>
  <div class="cat" style="margin-top:0">Поточне меню</div>
  <div class="setlist"><div class="set"><span>Люди</span><span class="v">${S.prefs.people}</span></div>
  <div class="set"><span>Бюджет на тиждень</span><span class="v">${S.prefs.budget}&nbsp;₴</span></div>
  <div class="set"><span>Мережа</span><span class="v">${S.prefs.store === "mix" ? "Разом" : ST[S.prefs.store]}</span></div>
  <div class="set"><span>Прийоми їжі</span><span class="v">${Core.slotsOf(S.prefs).length} на день</span></div></div>
  <div class="row"><button class="btn sec" onclick="S.settings=false;S.plan=Core.generate(ctx());S.done={};S.ck={};S.day=0;save();render()">Перемішати страви</button></div>
  <div class="row"><button class="btn" onclick="S.settings=false;S.step=0;S.plan=[];save();render()">Нове меню з іншими параметрами</button></div>
  <p class="note">${priceNote()}</p>` + tabbar(), "settings");
}
function book() {
  const q = (S.bookQ || "").toLowerCase();
  const TAG = Object.fromEntries(MOODS.map(([k, e, t]) => [k, e]));
  paint(`<header class="nav"><div class="navrow"><h1>Рецепти</h1><div class="navr">${themeBox()}</div></div>
  <input id="bq" class="search" type="search" placeholder="🔍 Страва або продукт" value="${esc(S.bookQ || "")}" style="margin-top:10px"></header>
  <div class="note" style="margin:0 0 6px">${MOODS.map(([k, e, t]) => `${e} ${t}`).join(" · ")} · 🍲 суп · 🧊 напівфабрикат</div>` +
  Core.SLOTS.map(sl => { const list = RC.filter(r => r.meals.includes(sl) && (!q || r.name.toLowerCase().includes(q) || r.ing.some(([p]) => PR[p].name.toLowerCase().includes(q))));
    return list.length ? `<div class="cat">${SL[sl][0]} ${SL[sl][1]} · ${list.length}</div>` + list.map(r => `<div class="meal" role="button" tabindex="0" onclick="S.open={rid:${r.id}};render()"><div class="em${[...r.emoji].filter(c => c.codePointAt(0) > 0x2000 && c !== "\uFE0F").length > 1 ? " em2" : ""}">${r.emoji}</div><div><div class="n">${esc(r.name)}</div><div class="k">${r.macro[0]} ккал · Б ${r.macro[1]} г · ${r.time} хв · ${r.tags.map(t => TAG[t] || "").join("")}${r.soup ? "🍲" : ""}${r.semi ? "🧊" : ""}</div></div><span class="chev">›</span></div>`).join("") : ""; }).join("") + tabbar(), "book");
  const inp = $("bq"); inp.oninput = () => { S.bookQ = inp.value; const pos = inp.selectionStart; book(); const i2 = $("bq"); i2.focus(); i2.setSelectionRange(pos, pos); };
}
function recipe() {
  if (S.open.rid != null) return recipeView(rec(S.open.rid), null, null);
  return recipeView(rec(S.plan[S.open.d][S.open.s]), S.open.d, S.open.s);
}
function recipeView(r, d, s) {
  const n = S.prefs.people, key = d + "-" + s, inPlan = d !== null;
  paint(`<header class="nav"><div class="navrow"><button class="back" aria-label="назад" onclick="S.open=null;render()"><span class="chev">‹</span> ${S.book ? "Рецепти" : "Меню"}</button></div></header><div class="hero${[...r.emoji].filter(c => c.codePointAt(0) > 0x2000 && c !== "\uFE0F").length > 1 ? " em2" : ""}" style="margin-top:10px">${r.emoji}</div><h1>${esc(r.name)}</h1><div class="sub">${inPlan ? DAYS[d] + " · " + SL[s][1] + " · " : r.meals.map(m => SL[m][1]).join(" / ") + " · "}${r.time} хв · ${n} ${n===1?"порція":n<5?"порції":"порцій"}</div>
  <div class="macro"><div><b>${r.macro[0]}</b><span>ккал</span></div><div><b>${r.macro[1]} г</b><span>білки</span></div><div><b>${r.macro[2]} г</b><span>жири</span></div><div><b>${r.macro[3]} г</b><span>вуглеводи</span></div></div>
  <div class="note" style="margin-top:0;text-align:center">на 1 порцію</div>
  ${(r.prep || []).filter(k => PREP[k]).length ? `<div class="sum" style="margin-top:10px">💡 Заготовка: ${(r.prep || []).filter(k => PREP[k]).map(k => esc(PREP[k].text.toLowerCase())).join("; ")} — див. вкладку «Заготовки».</div>` : ""}
  <h2>Інгредієнти</h2><ul class="ing">${r.ing.map(([p,q]) => `<li>${esc(PR[p].name)} — ${amt(p, q*n)}</li>`).join("")}<li>Сіль, спеції — за смаком</li></ul>
  <h2>Приготування</h2><ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
  ${inPlan ? `<div class="sticky-cta"><div class="row" style="margin:0"><button class="btn sec" onclick="doSwap(${d},'${s}')">Замінити</button><button class="btn" onclick="S.done['${key}']=!S.done['${key}'];save();S.open=null;render()">${S.done[key]?"Не приготовано":"Приготовано ✓"}</button></div></div>` : ""}`, "rec" + r.id);
}
function mixSaving(ids, c) {
  const singles = S.prefs.mixStores.map(k => ({ k, x: Core.cost(ids, ctx(), k) })).filter(o => !o.x.missing.length);
  if (!singles.length) return "";
  const best = singles.sort((a, b) => a.x.total - b.x.total)[0], d = Math.round(best.x.total - c.total);
  return d > 0 ? `<div class="ok">💰 Економія ${d}&nbsp;₴ порівняно з найдешевшою однією мережею (${ST[best.k]})</div>` : `<div style="color:var(--m)">Вигідніше купити все в ${ST[best.k]} — поріг економії не досягнуто</div>`;
}
// штучні продукти (яйця) — у штуках з точністю до ¼, решта — г/мл
function amt(p, g) {
  const pr = PR[p]; if (!pr.pcsG) return g + (pr.ml ? " мл" : " г");
  const x = Math.max(0.25, Math.round(g / pr.pcsG * 4) / 4), w = Math.floor(x), f = ["", "¼", "½", "¾"][Math.round((x - w) * 4)];
  return (w ? w : "") + f + " шт";
}
function qtyText(it) {
  if (it.sum === null) return "";
  const w = it.qty >= 1000 ? (it.qty / 1000).toLocaleString("uk-UA") + " кг" : it.qty + " г";
  if (it.kg) return it.pcs ? `${it.pcs} ${it.unitName || "шт"} ≈${w}` : w;
  const pc = PR[it.id] && PR[it.id].pcsG ? Math.round(it.qty / PR[it.id].pcsG) + " шт" : "";
  return it.packs > 1 ? "× " + it.packs + (pc ? " (" + pc + ")" : "") : pc;
}
function doSwap(d, s) { S.plan = Core.swap(S.plan, d, s, ctx()); delete S.done[d + "-" + s]; save(); render(); }
function next() {
  if (!canNext()) return;
  if (S.step < LAST) { S.step++; render(); return; }
  S.step = 8; render();
  setTimeout(() => { S.plan = Core.generate(ctx()); S.done = {}; S.ck = {}; S.day = 0; S.step = 9; S.tab = "plan"; save(); render(); }, 1200);
}
function copyList() {
  let last = ""; const t = `Список покупок (${stName(S.prefs.store)}):\n` + Core.shoppingList(Core.flat(S.plan), ctx(), S.prefs.store).flatMap(g => {
    const head = g.store !== undefined && g.store !== last ? [(last = g.store, `\n${g.store ? ST[g.store] : "Немає в обраних мережах"}:`)] : [];
    return head.concat(g.items.map(it => `- ${it.title || it.name} ${qtyText(it)}`)); }).join("\n");
  try { navigator.clipboard.writeText(t).then(() => $("cp").textContent = "Скопійовано ✓", () => $("cp").textContent = "Не вдалося скопіювати"); }
  catch (e) { $("cp").textContent = "Не вдалося скопіювати"; }
}
applyTheme();
(() => { let x0 = null, y0 = 0, sw = false, block = 0;  // свайп вліво/вправо — інший день меню
  const on = () => S.step === 9 && S.tab === "plan" && !S.open && !S.book && !S.settings;
  document.addEventListener("touchstart", e => { sw = false; if (on()) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, { passive: true });
  document.addEventListener("touchmove", e => { if (x0 === null || sw) return; const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { sw = true; document.body.classList.add("swiping"); } }, { passive: true });
  document.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (sw && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) { block = Date.now() + 450; const n = S.plan.length; S.day = (Math.min(S.day, n - 1) + (dx < 0 ? 1 : n - 1)) % n;
      SLIDE = dx < 0 ? "slide-l" : "slide-r"; render(); } else document.body.classList.remove("swiping"); }, { passive: true });
  document.addEventListener("click", e => { if (Date.now() < block) { e.stopPropagation(); e.preventDefault(); } }, true);  // не відкривати страву після свайпу
})();
render();
</script></body></html>
