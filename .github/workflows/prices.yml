name: Оновлення цін
on:
  schedule:
    - cron: "30 4 * * *"   # щодня о 06:30 за Києвом (зимовий час); з GitHub доступний лише METRO
  workflow_dispatch: {}      # кнопка «Run workflow» — оновити вручну
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Оновити ціни
        timeout-minutes: 18
        env: { STORES: metro }
        run: node tools/update_site.js
      - name: Зберегти, якщо змінилось
        run: |
          git config user.name "koshyk-bot"
          git config user.email "koshyk-bot@users.noreply.github.com"
          git add site/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Ціни METRO $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done; exit 1
