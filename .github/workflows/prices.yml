name: Оновлення цін
on:
  schedule:
    - cron: "30 4 * * *"   # щодня о 06:30 за Києвом (зимовий час)
  workflow_dispatch: {}      # кнопка «Run workflow» — оновити вручну
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Встановити браузер для Сільпо
        run: cd tools && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Оновити ціни
        run: node tools/update_site.js
      - name: Зберегти, якщо змінилось
        run: |
          git config user.name "koshyk-bot"
          git config user.email "koshyk-bot@users.noreply.github.com"
          git add site/prices.json
          git diff --cached --quiet || (git commit -m "Ціни $(date -u +%F)" && git push)
