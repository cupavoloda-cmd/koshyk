name: Оновлення цін
on:
  schedule:
    - cron: "30 4 * * *"   # щодня о 06:30 за Києвом (зимовий час); з GitHub доступний лише METRO
  workflow_dispatch: {}      # кнопка «Run workflow» — оновити вручну
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Оновити ціни
        timeout-minutes: 18
        env: { STORES: metro }
        run: node tools/update_site.js
      - name: Зберегти METRO поверх найсвіжішої версії
        run: |
          git config user.name "koshyk-bot"
          git config user.email "koshyk-bot@users.noreply.github.com"
          cp site/prices.json /tmp/new.json
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            node -e "const f='site/prices.json',a=require('/tmp/new.json'),b=require('./'+f);for(const k of ['p','old','until']){b[k]=b[k]||{};b[k].metro=(a[k]||{}).metro||{}};b.updated=a.updated;require('fs').writeFileSync(f,JSON.stringify(b))"
            git add site/prices.json
            git diff --cached --quiet && exit 0
            git commit -qm "Ціни METRO $(date -u +%F)" && git push && exit 0
            sleep 5
          done
          exit 1
